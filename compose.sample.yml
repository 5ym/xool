services:
  xool:
    build:
      target: base
    volumes:
      - .:/usr/src/app
    command: dev
    networks:
      - docker_default
      - default
    environment:
      - HOST=x.localhost
      - CLIENT_ID=
      - CLIENT_SECRET=
      - HASH=
    labels:
      - "traefik.http.routers.xool.rule=Host(`x.localhost`)"
      - "traefik.http.routers.xool.tls=true"

networks:
  docker_default:
    external: true
    name: docker_default
