apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool
  namespace: xool
spec:
  replicas: 1
  # Bring the replacement up and let it pass its readiness probe before the old
  # pod goes away, so the site never drops to zero serving pods. The images and
  # database PVCs are ReadWriteOnce, but local-path pins them to a node and the
  # scheduler follows, so both pods land there and can mount them together.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Hold the new pod ready for a moment before retiring the old one, so a pod
  # that starts and immediately falls over doesn't take the old one with it.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: xool
  template:
    metadata:
      labels:
        app: xool
    spec:
      # preStop (5s) + the adapter's SHUTDOWN_TIMEOUT (30s), with room to spare.
      terminationGracePeriodSeconds: 45
      containers:
        - name: xool
          image: ghcr.io/danything/xool:a18af747a7f589cb381a7ebd7d58e9b18868a17b
          ports:
            - containerPort: 3000
          # Endpoint removal and SIGTERM race each other. Sleeping first lets
          # Traefik stop routing here before the server stops accepting, so
          # in-flight clicks aren't answered with a connection reset.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: ORIGIN
              value: https://x.doany.io
            # Finish serving in-flight requests before exiting; must stay under
            # terminationGracePeriodSeconds above.
            - name: SHUTDOWN_TIMEOUT
              value: "30"
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-secret
            - name: HASH
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: hash
          volumeMounts:
            - name: xool-images
              mountPath: /usr/src/app/images
            - name: xool-db
              mountPath: /usr/src/app/data
      volumes:
        - name: xool-images
          persistentVolumeClaim:
            claimName: xool-images
        - name: xool-db
          persistentVolumeClaim:
            claimName: xool-db
