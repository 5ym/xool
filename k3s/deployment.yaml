apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool
  namespace: xool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xool
  template:
    metadata:
      labels:
        app: xool
    spec:
      containers:
        - name: xool
          image: ghcr.io/5ym/xool:c6080ab04608a8cfeea64425c14ef74085c465b3
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: HOST
              value: x.doany.io
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-secret
            - name: HASH
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: hash
          volumeMounts:
            - name: xool-images
              mountPath: /usr/src/app/images
            - name: xool-db
              mountPath: /usr/src/app/data
      volumes:
        - name: xool-images
          persistentVolumeClaim:
            claimName: xool-images
        - name: xool-db
          persistentVolumeClaim:
            claimName: xool-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool-web
  namespace: xool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xool-web
  template:
    metadata:
      labels:
        app: xool-web
    spec:
      containers:
        - name: xool-web
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: xool-images
              mountPath: /usr/share/nginx/html/images
      volumes:
        - name: xool-images
          persistentVolumeClaim:
            claimName: xool-images
