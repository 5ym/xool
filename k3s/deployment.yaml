apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool
  namespace: xool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xool
  template:
    metadata:
      labels:
        app: xool
    spec:
      containers:
        - name: xool
          image: ghcr.io/danything/xool:80a737011f02a96dcfb679309b1696c4a86177e9
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: HOST
              value: x.doany.io
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-secret
            - name: HASH
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: hash
          volumeMounts:
            - name: xool-images
              mountPath: /usr/src/app/images
            - name: xool-db
              mountPath: /usr/src/app/data
      volumes:
        - name: xool-images
          persistentVolumeClaim:
            claimName: xool-images
        - name: xool-db
          persistentVolumeClaim:
            claimName: xool-db
