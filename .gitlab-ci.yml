default:
  image: docker:latest
  services:
    - docker:dind

docker-production-build:
  stage: build
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/app" .
    - docker push "$CI_REGISTRY_IMAGE/app"
  only:
    - main

update-production:
  image: bitnami/kubectl:latest
  stage: deploy
  before_script:
    - export KUBECONFIG="$KUBECONFIG_FILE"
  script:
    - kubectl apply -f /home/ruk/k3s/blog/deployment.yaml
    - kubectl rollout status deployment/blog -n blog --timeout=120s
  only:
    - main

docker-build:
  stage: build
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_BRANCH" .
    - docker push "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_BRANCH"
  except:
    - main
