stages:
  - build
  - deploy

build-image:
  stage: build
  image: moby/buildkit:v0.14.1-rootless
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p "$HOME/.docker"
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name="$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA",push=true \
        --output type=image,name="$CI_REGISTRY_IMAGE/app:latest",push=true

update-production:
  image: bitnami/kubectl:1.30.3
  stage: deploy
  before_script:
    - export KUBECONFIG="$KUBECONFIG_FILE"
  script:
    - kubectl apply -f /home/ruk/k3s/blog/deployment.yaml
    - kubectl rollout status deployment/blog -n blog --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'