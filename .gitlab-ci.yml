build-image:
  stage: build
  image: moby/buildkit
  before_script:
    - mkdir -p "$HOME/.docker"
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --output type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,push=true \
        --output type=image,name=$CI_REGISTRY_IMAGE:latest,push=true

update-production:
  image: bitnami/kubectl
  stage: deploy
  variables:
    TARGET_NAMESPACE: xool
    TARGET_DEPLOYMENT: xool
    K8S_SERVER: https://kubernetes.default.svc.cluster.local:443
    K8S_CA_B64: 
  before_script:
    - printf '%s' "$K8S_CA_B64" | base64 -d > /tmp/k8s-ca.crt
  script:
    - kubectl --server="$K8S_SERVER" --certificate-authority=/tmp/k8s-ca.crt --token="$WEBHOOK_K8S_TOKEN" -n "$TARGET_NAMESPACE" rollout restart deployment/"$TARGET_DEPLOYMENT"
    - kubectl --server="$K8S_SERVER" --certificate-authority=/tmp/k8s-ca.crt --token="$WEBHOOK_K8S_TOKEN" -n "$TARGET_NAMESPACE" rollout status deployment/"$TARGET_DEPLOYMENT" --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'