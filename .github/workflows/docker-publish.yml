name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # Merging the bot's own image-bump PR only touches k3s/, so ignoring it
    # here stops the build -> bump PR -> merge -> build loop.
    paths-ignore:
      - 'k3s/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Baked into version.json so tabs opened before a rollout can tell
          # they are running an older build.
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main is protected (requires the "build" check), which this bot can't
      # satisfy or bypass, so it opens a PR for a human to merge instead of
      # pushing directly.
      - name: Open PR to update deployment image tag
        run: |
          sed -i "s#image: ${REGISTRY}/[^:[:space:]]*/xool:[^[:space:]]*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" k3s/deployment.yaml
          if ! git diff --quiet -- k3s/deployment.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            branch="bump-xool-image"
            git checkout -b "$branch"
            git add k3s/deployment.yaml
            git commit -m "chore: update xool image to ${GITHUB_SHA}"
            git push --force origin "$branch"
            title="chore: update xool image to ${GITHUB_SHA::7}"
            body="Automated image tag bump for commit ${GITHUB_SHA}. Merge to deploy."
            gh pr create --base main --head "$branch" --title "$title" --body "$body" \
              || gh pr edit "$branch" --title "$title" --body "$body"
          fi
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
