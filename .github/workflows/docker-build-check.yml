name: Docker Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The bot's image-bump PRs only touch k3s/, so there is nothing to build.
    # Skipping at the job level (not via paths-ignore) still reports the
    # required "build" check, so the PR stays mergeable.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # PR-scoped cache is only readable by later pushes to the same PR
          # (main can't read it), so keep it small with mode=min and leave the
          # 10GB repo budget for main's mode=max cache that every PR reads.
          cache-from: type=gha
          cache-to: type=gha,mode=min
